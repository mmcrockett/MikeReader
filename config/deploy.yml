# Name of your application. Used to uniquely configure containers.
service: mikereader

# Name of the container image.
image: mmcrockett/mikereader

# Deploy to these servers.
# This is the real target Debian 12 box (dreamcompute) -- see
# 07-docker-kamal-deploy.md. Nothing else runs on it, so kamal-proxy can use
# its default ports (80/443) with no collision to work around.
servers:
  web:
    - 208.113.135.206
  # job:
  #   hosts:
  #     - 208.113.135.206
  #   cmd: bin/jobs

# No host/ssl set yet: DNS (reader.mmcrockett.com) still points at the old
# Debian 11 box, so Let's Encrypt's HTTP-01 challenge would fail here anyway.
# Validate via direct IP over plain HTTP first; set proxy.ssl/proxy.host once
# DNS cutover actually happens (kamal-proxy has its own Let's Encrypt client,
# no nginx/Certbot needed on this box).
# proxy:
#   ssl: true
#   host: reader.mmcrockett.com

# Where you keep your container images.
registry:
  server: ghcr.io
  username: mmcrockett

  # Always use an access token rather than real password when possible.
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    # Run the Solid Queue Supervisor inside the web server's Puma process to do jobs.
    # When you start using multiple servers, you should split out job processing to a dedicated machine.
    SOLID_QUEUE_IN_PUMA: true

    # Set number of processes dedicated to Solid Queue (default: 1)
    # JOB_CONCURRENCY: 3

    # Set number of cores available to the application on each server (default: 1).
    # WEB_CONCURRENCY: 2

    # The app's primary database lives on the existing production MySQL host,
    # not a Kamal-managed accessory -- see config/database.yml. No DB_HOST
    # override needed here.

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Use a persistent storage volume for sqlite database files (Solid Queue/Cache/Cable)
# and local Active Storage files. Recommended to change this to a mounted volume
# path that is backed up off server.
volumes:
  - "mikereader_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64

  # # Build image via remote server (useful for faster amd64 builds on arm64 computers)
  # remote: ssh://docker@docker-builder-server

# This box's SSH access is via a non-root "debian" user + dedicated key.
ssh:
  user: debian
  keys: [ "~/.ssh/dreamcompute12" ]
  # Force this specific key rather than letting net-ssh offer every identity
  # in the local ssh-agent.
  keys_only: true
  # Agent forwarding isn't needed (the box never needs to SSH anywhere using
  # our local keys) and caused a real hang: forwarding spawns a fresh
  # ssh-agent process on the remote box, and if it inherits the session's
  # stdout/stderr pipes, the SSH channel never sees EOF -- even after the
  # actual remote command (docker login) finishes and prints its output.
  forward_agent: false

# Use accessory services (secrets come from .kamal/secrets).
# No accessories needed: MySQL is the existing production host (external,
# not managed by Kamal), and Redis was dropped in favor of Solid Cable.
