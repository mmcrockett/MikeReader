# SQLite for development/test (unchanged from the old app's dev setup).
#   gem install sqlite3
#
default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3

# Primary app data stays on the existing remote MySQL host (unchanged).
# Solid Cache/Queue/Cable get their own local sqlite3 stores for now --
# revisit in phase 5 (background jobs/ActionCable) if that needs to change.
staging:
  primary:
    adapter: mysql2
    host: mysql.mmcrockett.com
    username: mysql_mmcrockett
    password: <%= Rails.application.credentials.mysql_password { 'badpassword' } %>
    database: reader_test_mmcrockett
  cache:
    <<: *default
    database: storage/staging_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: storage/staging_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: storage/staging_cable.sqlite3
    migrations_paths: db/cable_migrate

production:
  primary:
    adapter: mysql2
    host: mysql.mmcrockett.com
    username: mysql_mmcrockett
    password: <%= Rails.application.credentials.mysql_password { 'badpassword' } %>
    database: reader_mmcrockett
  cache:
    <<: *default
    database: storage/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: storage/production_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: storage/production_cable.sqlite3
    migrations_paths: db/cable_migrate
