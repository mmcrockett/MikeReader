name: Build and push image

on:
  push:
    branches:
      - mcrockett/8.x-upgrade
  workflow_dispatch: {}

# Cancel a superseded run (e.g. a quick follow-up push) rather than letting
# both race to push the image.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system deps for bundling (mysql2 native extension)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends default-libmysqlclient-dev

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4.10"
          bundler-cache: true

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Reuses the app's own Kamal config/versioning so the tag this step
      # pushes is exactly what `kamal deploy --skip_push` will look for.
      - name: kamal build push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bundle exec kamal build push
