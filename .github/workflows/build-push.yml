name: Build and push image

on:
  push: {}
  workflow_dispatch: {}

# Avoids two pushes racing to push the same tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system deps for bundling (mysql2 native extension)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends default-libmysqlclient-dev

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4.10"
          bundler-cache: true

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Reuses the app's own Kamal config/versioning so the tag this step
      # pushes is exactly what `kamal deploy --skip_push` will look for.
      - name: kamal build push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bundle exec kamal build push

      # Every build leaves ~2 untagged attestation/provenance blobs alongside
      # the real tagged image. Only prune on main (a feature branch pushing
      # many times shouldn't be able to evict main's own recent, deployable
      # tags), and only after a real, successful build -- never on a
      # workflow_dispatch dry run or a failed build.
      #
      # continue-on-error: cleanup is best-effort. GHCR can cascade-remove a
      # sibling manifest when its parent gets deleted, which raced this
      # action's pre-fetched list on a large first-time prune ("Package not
      # found" after successfully deleting 34/35) -- a step failure here must
      # never fail the job, since deploy.yml only triggers on a *successful*
      # build-push run.
      - name: Delete untagged image versions (attestation/provenance noise)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: mikereader
          package-type: container
          min-versions-to-keep: 0
          delete-only-untagged-versions: true

      - name: Keep only the 5 most recent tagged image builds
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: mikereader
          package-type: container
          min-versions-to-keep: 5
